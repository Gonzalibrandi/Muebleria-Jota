<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermanos Jota | Catálogo</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="logo" aria-label="Hermanos Jota — Inicio">
        <img src="img/logo.svg" alt="Hermanos Jota" width="120" height="120" />
      </a>
      <nav class="site-nav" aria-label="Principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html" aria-current="page">Catálogo</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <div class="cart-widget" aria-live="polite">
        <span>Carrito</span>
        <span id="cart-count">0</span>
      </div>
    </header>

    <main>
      <section class="catalog" aria-labelledby="catalog-title">
        <h1 id="catalog-title">Catálogo</h1>

        <!-- Bonus: búsqueda -->
        <form id="search-form" role="search">
          <label for="search-input">Buscar productos</label>
          <input type="search" id="search-input" name="q" autocomplete="off" />
        </form>

        <!-- JS: renderizar grilla de tarjetas -->
        <div id="product-list" class="product-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Hermanos Jota Casa Taller — Av. San Juan 2847, San Cristóbal, CABA</p>
      <p>info@hermanosjota.com.ar · +54 11 4567-8900</p>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/main.js"></script>
    <script src="js/catalogo.js"></script>
  </body>
</html>
