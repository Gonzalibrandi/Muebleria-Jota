<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermanos Jota | Catálogo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="site-header"></header>

  <main>
    <section class="catalog" aria-labelledby="catalog-title">
      <h1 id="catalog-title">Catálogo</h1>

      <!-- Bonus: búsqueda -->
      <form id="search-form" role="search" class="search-form">
        <label for="search-input" class="visually-hidden">Buscar productos</label>
        <input type="search" id="search-input" name="q" autocomplete="off"
          placeholder="Buscar productos por nombre..." />
      </form>

      <!-- JS: renderizar grilla de tarjetas -->
      <div id="product-list" class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <!-- Overlay del Carrito -->
  <div id="cart-overlay" class="cart-overlay" aria-hidden="true"></div>

  <!-- Drawer Lateral del Carrito -->
  <aside id="cart-drawer" class="cart-drawer" aria-label="Carrito de compras" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="cart-drawer-header">
      <div class="cart-header-title">
        <h2>Tu Carrito</h2>
        <span class="cart-header-subtitle">Hermanos Jota</span>
      </div>
      <button id="cart-close-btn" class="cart-close-btn" aria-label="Cerrar carrito">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div id="cart-items" class="cart-items">
      <!-- Renderizado dinámico de productos -->
    </div>

    <div class="cart-drawer-footer">
      <div class="cart-summary">
        <div class="cart-summary-row">
          <span>Total:</span>
          <span id="cart-total" class="cart-total-amount">$ 0</span>
        </div>
        <p class="cart-shipping-note">Impuestos incluidos. Envío coordinado tras la compra.</p>
      </div>
      <div class="cart-drawer-actions">
        <button id="cart-clear-btn" class="btn-cart-clear" type="button">Vaciar Carrito</button>
        <button id="cart-checkout-btn" class="btn-cart-checkout" type="button">Finalizar Compra</button>
      </div>
    </div>
  </aside>

  <script src="js/productos.js"></script>
  <script src="js/main.js"></script>
  <script src="js/catalogo.js"></script>
</body>

</html>
